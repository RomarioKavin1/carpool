name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

      # `pnpm test` is scripts/run-tests.mjs, not a bare `turbo run test`: turbo
      # stops scheduling dependents on the first failure, and a red run therefore
      # used to report "4 successful, 8 total" while 236 of 506 tests were never
      # started. The wrapper derives the expected package set from the workspace
      # and fails loudly, naming them, if any package produced no result.
      - run: pnpm test

      # The A/B measurement needs an artifact and a private transcript that no CI
      # runner has, so its measurement half legitimately skips here. What must NOT
      # happen is the skip passing unremarked: this step prints exactly what was
      # and was not verified, and fails if the runner left no status at all (which
      # is what a silently skipped file looks like). The doc and record guards in
      # apps/bench/src/ab-doc.test.ts never skip and already ran above, inside
      # `pnpm test`.
      - name: A/B measurement — report what this runner could verify
        run: |
          CARPOOL_AB_STATUS="$PWD/.ab-status.json" pnpm ab:run
          node scripts/check-ab-status.mjs "$PWD/.ab-status.json"

      - name: Upload A/B status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-status-node-${{ matrix.node }}
          path: .ab-status.json
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
